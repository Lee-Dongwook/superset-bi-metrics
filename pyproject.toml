[project]
name = "superset-bi-metrics"
description = "Apache Superset Open Source Oriented BI Metrics Test Project"
readme = "README.md"
dynamic = ["version", "scripts", "entry-points"]
requires-python = ">=3.11"
# Original Author = Apache Software Foundation
authors = [
    { name = "Lee-DongWook", email = "dlehddnr0713@gmail.com"}
]
dependencies = [
    "alembic>=1.20.0",
    "celery>=5.6.3",
    "click>=8.5.0",
    "colorama>=0.4.6",
    "cryptography>=50.0.2",
    "flask>=3.1.3",
    "flask-appbuilder>=5.2.3",
    "flask-babel>=4.0.0",
    "flask-caching>=2.5.1",
    "flask-jwt-extended>=4.7.4",
    "flask-login>=0.6.3",
    "flask-migrate>=4.1.0",
    "flask-sqlalchemy>=3.1.1",
    "flask-talisman>=1.1.0",
    "flask-wtf>=1.3.0",
    "httpx>=0.28.1",
    "markdown>=3.11",
    "markupsafe>=3.0.4",
    "marshmallow>=4.3.1",
    "numpy>=2.4.6",
    "pandas>=3.0.6",
    "redis>=8.1.0",
    "sqlalchemy>=2.1.4",
    "sqlglot>=30.22.0",
    "sshtunnel>=0.5.1",
    "statsd>=4.0.1",
    "typing-extensions>=4.16.0",
    "werkzeug>=3.1.9",
    "wtforms>=3.2.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
